<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSS Leaflet (Beta)</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <div id="map"></div>
    <div id="cctv-lightbox">
    <img id="cctv-lightbox-img">
    </div>

    <button class="layersButton" id="layersToggle" aria-expanded="false"><img src="layers.png" width="35px"/></button>
    <div class="layers-panel" id="layersPanel">
        <strong>Map Layers</strong>
                <!-- timestamp-controls moved into Forecast group below -->
        <div class="layer-group" data-group="road">
            <button class="group-header" aria-expanded="true">Road/Travel Conditions</button>
            <div class="group-content">
                <label><input type="checkbox" id="cctv" data-layer-id="cctv">CCTV</label>
                <label><input type="checkbox" id="cms" data-layer-id="cms">CMS (Changeable Message Sign)</label>
                <label><input type="checkbox" id="incidents" data-layer-id="incidents">Incidents</label>
                <label><input type="checkbox" id="rwis" data-layer-id="rwis">RWIS (Road Weather Information System)</label>
                <label><input type="checkbox" id="chainRequirements" data-layer-id="chainRequirements">Chain Requirements</label>
                <label><input type="checkbox" id="fireIncidents" data-layer-id="fireIncidents">Fire Incidents</label>
            </div>
        </div>

        <div class="layer-group" data-group="forecast">
            <button class="group-header" aria-expanded="false">Forecast Weather</button>
            <div class="group-content" style="display:none">
                <div class="timestamp-controls" style="margin:8px 0;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button id="tsPrev" title="Previous time" style="padding:4px 8px">◀</button>
                        <div style="display:flex; flex-direction:column;">
                            <label for="timestampSelect" style="font-size:11px;">Time</label>
                            <select id="timestampSelect" style="min-width:200px"></select>
                        </div>
                        <button id="tsNext" title="Next time" style="padding:4px 8px">▶</button>
                        <div id="timestampLabel" aria-live="polite" style="font-size:12px; color:#222; margin-left:6px;">&nbsp;</div>
                    </div>
                </div>
                <label><input type="checkbox" id="weather" data-layer-id="weather">Weather</label>
                <label><input type="checkbox" id="windSpeed" data-layer-id="windSpeed">Wind Speed</label>
                <label><input type="checkbox" id="windGustSpeed" data-layer-id="windGustSpeed">Wind Gust Speed</label>
                <label><input type="checkbox" id="temperature" data-layer-id="temperature">Temperature</label>
                <label><input type="checkbox" id="humidity" data-layer-id="humidity">Humidity</label>
                <label><input type="checkbox" id="skyCover" data-layer-id="skyCover">Sky Cover</label>
                <label><input type="checkbox" id="snow" data-layer-id="snow">Snow</label>
            </div>
        </div>
    </div>

    <!-- Load the module entry point (user-created). Adjust path if you put main.js elsewhere -->
    <script type="module" src="./main.js"></script>
</body>

</html>
